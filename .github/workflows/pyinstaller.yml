name: Windows build

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller asterscan.spec
      - run: pyinstaller asterscan-updater.spec
      - run: pyinstaller asterscan-studio.spec
      - run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/asterscan-package/tools
          Copy-Item dist/asterscan.exe,dist/asterscan-updater.exe,dist/asterscan-studio.exe dist/asterscan-package/
          Copy-Item tools/pe-sieve32.exe,tools/pe-sieve64.exe dist/asterscan-package/tools/
          Copy-Item LICENSE,README.md dist/asterscan-package/
          Copy-Item config,docs dist/asterscan-package/ -Recurse
          New-Item -ItemType Directory -Force dist/asterscan-package/.github
          Copy-Item .github/assets dist/asterscan-package/.github/ -Recurse
        shell: pwsh
      - run: |
          & dist/asterscan-package/asterscan.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'AsterScan help failed' }
          & dist/asterscan-package/asterscan.exe --version --nolog | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'AsterScan startup failed' }
          & dist/asterscan-package/asterscan-updater.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Updater startup failed' }
          & dist/asterscan-package/asterscan-studio.exe --version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Studio startup failed' }
          $fixture = Join-Path $env:RUNNER_TEMP 'asterscan-runtime-test'
          New-Item -ItemType Directory -Force "$fixture/signature-base/yara", "$fixture/signature-base/iocs", "$fixture/signature-base/misc", "$fixture/config", "$fixture/tools" | Out-Null
          Copy-Item dist/asterscan-package/*.exe $fixture/
          Copy-Item dist/asterscan-package/tools/*.exe "$fixture/tools/"
          Copy-Item config/excludes.cfg "$fixture/config/"
          Set-Content -Path "$fixture/signature-base/misc/file-type-signatures.txt" -Value ''
          Set-Content -Path "$fixture/signature-base/yara/test.yar" -Value 'rule AsterWindowsTest { strings: $marker = "ASTERSCAN_WINDOWS_TEST" condition: $marker }'
          Set-Content -Path "$fixture/target.txt" -Value 'ASTERSCAN_WINDOWS_TEST'
          $report = "$fixture/scan-report.html"
          $scan = & "$fixture/asterscan.exe" --nolog --noindicator --noprocscan --intense -p "$fixture/target.txt" --report $report 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $scan -notmatch 'AsterWindowsTest' -or $scan -notmatch 'Suspicious objects detected') { throw "Windows fixture scan failed: $scan" }
          if (-not (Test-Path $report) -or (Get-Content $report -Raw) -notmatch 'AsterWindowsTest') { throw 'Windows HTML report failed' }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: asterscan-windows
          path: dist/asterscan-package/
          include-hidden-files: true
