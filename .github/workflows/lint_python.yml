name: Python smoke checks

on: [pull_request, push, workflow_dispatch]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q asterscan.py asterscan-updater.py asterscan-studio.py lib plugins
      - run: python asterscan.py --help
      - run: python asterscan.py --version --nolog
      - run: python asterscan-updater.py --help
      - run: python -m unittest discover -s test -p 'test_*.py'
